<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="application-name" content="校园智能调度平台" />
    <meta
      name="description"
      content="校园智能调度平台 —— 面向校园场景的 AI 调度网站。一句话说出需求，AI 自动完成解析、匹配、结果生成与通知。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>校园智能调度平台</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f4ef;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        color: #555147;
        background: #f6f4ef;
      }
      #boot .bmark {
        width: 44px;
        height: 44px;
        border-radius: 4px;
        background: #33546b;
        animation: bpulse 1.6s ease-in-out infinite;
      }
      #boot p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      @keyframes bpulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div class="bmark"></div><p>校园智能调度平台 · 正在为你准备调度台</p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
