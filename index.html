<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6c63ff" />
    <meta name="application-name" content="校园智能调度平台" />
    <meta
      name="description"
      content="校园智能调度平台 —— 面向校园场景的 AI 调度网站。一句话说出需求，AI 自动完成解析、匹配、结果生成与通知。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>校园智能调度平台</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5f6fb;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        color: #4b5573;
        background: radial-gradient(1200px 600px at 15% 0%, #ecebff 0%, #f5f6fb 55%);
      }
      #boot .bmark {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6c63ff, #12b3a6);
        box-shadow: 0 18px 40px -16px rgba(108, 99, 255, 0.8);
        animation: bpulse 1.4s ease-in-out infinite;
      }
      #boot p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
      @keyframes bpulse {
        0%,
        100% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        50% {
          transform: translateY(-6px) scale(0.96);
          opacity: 0.75;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div class="bmark"></div><p>校园智能调度平台 · 正在为你准备调度台</p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
